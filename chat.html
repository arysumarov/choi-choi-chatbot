<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b9a4f">
<title>Choi Choi 菜菜</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:image" content="https://choi-choi-chatbot.vercel.app/assets/choichoi-poster.jpg">
<meta property="og:title" content="Choi Choi 菜菜 · Central Farmers' Market">
<style>
  :root {
    --green: #6b9a4f;
    --green-dark: #4a7236;
    --leaf: #a8d672;
    --cream: #f4ecdf;
    --ink: #4a3a2a;
    --muted: #7a6a58;
    --bubble-bot: #fffdf8;
    --bubble-me: #e3ebd3;
    --line: #e6dccb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 560px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--cream);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    background: var(--green);
    color: #fff;
  }
  header .avatar { width: 46px; height: 46px; flex: none; display: block; object-fit: contain; background: var(--cream); border-radius: 50%; padding: 3px; }
  header .home { flex: none; line-height: 0; }
  header h1 { font-size: 18px; margin: 0; line-height: 1.2; }
  header p { margin: 0; font-size: 12px; opacity: .9; }
  header .titles { flex: 1; min-width: 0; }
  .spk {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.8); background: transparent;
    font-size: 17px; cursor: pointer; display: grid; place-items: center;
  }
  .spk[aria-pressed="true"] { background: #fff; }
  .replay {
    flex: none; align-self: flex-end; border: 0; background: transparent;
    font-size: 16px; cursor: pointer; opacity: .55; padding: 4px;
  }
  .replay:hover, .replay.playing { opacity: 1; }
  .lang {
    display: flex;
    border: 1.5px solid rgba(255,255,255,.8);
    border-radius: 999px;
    overflow: hidden;
    flex: none;
  }
  .lang button {
    border: 0; background: transparent; color: #fff;
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 11px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--green-dark); }

  /* Chat */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row.me { justify-content: flex-end; }
  .row .mini { width: 32px; height: 32px; flex: none; object-fit: contain; }
  .bubble {
    max-width: 80%;
    padding: 10px 13px;
    border-radius: 18px;
    line-height: 1.45;
    font-size: 15.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bot .bubble { background: var(--bubble-bot); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .me .bubble { background: var(--bubble-me); border-bottom-right-radius: 6px; }
  .bubble.error { background: #fff4e5; border-color: #f3d5a8; }
  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px;
    background: var(--green); border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-5px); opacity: 1; } }

  /* Hero (first screen) */
  .hero { text-align: center; padding: 8px 0 4px; }
  .hero .big { width: 110px; height: auto; animation: wiggle 3s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

  /* Quick replies */
  #quick {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 8px;
    scrollbar-width: none;
  }
  #quick::-webkit-scrollbar { display: none; }
  #quick button {
    flex: none;
    border: 1.5px solid var(--green);
    background: #fff;
    color: var(--green-dark);
    border-radius: 999px;
    padding: 7px 13px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #quick button:active { background: var(--bubble-me); }

  /* Input bar */
  form {
    display: flex;
    gap: 8px;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
    background: #fff;
  }
  #input {
    flex: 1;
    min-width: 0;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 15px;
    font: inherit;
    font-size: 16px; /* 16px stops iOS zooming in */
    outline: none;
  }
  #input:focus { border-color: var(--green); }
  .icon-btn {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 0;
    display: grid; place-items: center;
    cursor: pointer;
    font-size: 20px;
  }
  #mic {
    background: #eef5e4; color: var(--green-dark);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #mic.listening { background: #e5533d; color: #fff; animation: pulse 1s infinite; transform: scale(1.15); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(229,83,61,.5); } 50% { box-shadow: 0 0 0 8px rgba(229,83,61,0); } }
  #send { background: var(--green); color: #fff; }
  #send:disabled { opacity: .5; cursor: default; }
  .note { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 16px 6px; background: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="/" class="home" aria-label="Home"><img class="avatar" src="/assets/choichoi-256.webp" alt="" width="46" height="46"></a>
    <div class="titles">
      <h1>Choi Choi 菜菜</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <button type="button" id="speak" class="spk" aria-pressed="false" aria-label="Read replies aloud" hidden>🔇</button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="yue">粵</button>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div id="quick"></div>

  <form id="form" autocomplete="off">
    <button type="button" id="mic" class="icon-btn" aria-label="Hold to talk" hidden>🎤</button>
    <input id="input" type="text" maxlength="500" enterkeyhint="send">
    <button type="submit" id="send" class="icon-btn" aria-label="Send">➤</button>
  </form>
  <div class="note" data-i18n="note"></div>
</div>


<script>
(() => {
  const T = {
    en: {
      subtitle: "Your cabbage friend at the Central Farmers' Market",
      placeholder: "Ask Choi Choi anything…",
      note: "Choi Choi is a cabbage, not an expert 🥬 Please don't share personal details.",
      hello: "Hi! I'm Choi Choi 菜菜, a little cabbage from a Hong Kong organic farm 🥬\nAsk me about the market, the farmers, or local farming. You can type, or hold 🎤 and talk!",
      quick: ["What's in season?", "Meet the farmers", "Why is organic more expensive?", "When is the market open?", "What's HKORC certified?", "KFBG events"],
      error: "Oops, my leaves got tangled 🥬 Please try again in a moment!",
      noMic: "Sorry, voice input doesn't work in this browser. Please type instead!",
      listening: "Listening… let go to send",
      holdHint: "Hold 🎤 while you talk, let go to send",
      mic: "en-US",
    },
    yue: {
      subtitle: "中環農墟嘅椰菜朋友",
      placeholder: "問吓菜菜啦…",
      note: "菜菜係一棵椰菜，唔係專家 🥬 請唔好分享個人資料。",
      hello: "你好！我係菜菜，一棵嚟自香港有機農場嘅小椰菜 🥬\n你可以問我關於農墟、農夫或者本地耕種嘅嘢。打字或者㩒住 🎤 講嘢都得！",
      quick: ["而家有咩時令菜？", "認識吓啲農夫", "點解有機菜貴啲？", "農墟幾點開？", "咩係 HKORC 認證？", "嘉道理有咩活動？"],
      error: "哎呀，我啲葉打晒結 🥬 請遲啲再試吓！",
      noMic: "唔好意思，呢個瀏覽器用唔到語音輸入，請打字啦！",
      listening: "聽緊…放手就會發送",
      holdHint: "㩒住 🎤 講嘢，放手就會發送",
      mic: "zh-HK",
    },
  };

  const $ = (s) => document.querySelector(s);
  const chat = $("#chat"), input = $("#input"), form = $("#form"),
        sendBtn = $("#send"), micBtn = $("#mic"), quick = $("#quick");

  let lang = "en";
  try { lang = localStorage.getItem("cc-lang") || (/^zh/i.test(navigator.language) ? "yue" : "en"); } catch {}
  const history = []; // {role, content} – kept only in this tab, never stored
  let busy = false;

  // ---- Voice output (browser speechSynthesis – free, runs on the phone) ----
  const synth = window.speechSynthesis || null;
  let speakOn = false, unlocked = false, voices = [];
  try { speakOn = localStorage.getItem("cc-speak") === "1"; } catch {}
  const loadVoices = () => { voices = synth ? synth.getVoices() : []; };
  if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", loadVoices); }

  function pickVoice(yue) {
    const prefs = yue ? [/^zh[-_]HK/i, /^yue/i] : [/^en[-_]US/i, /^en[-_]GB/i, /^en/i];
    for (const re of prefs) {
      const v = voices.find((v) => re.test(v.lang));
      if (v) return v;
    }
    return null;
  }

  // iOS only allows speech that starts inside a tap, so "unlock" it on the first tap.
  function unlock() {
    if (!synth || unlocked) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    synth.speak(u);
    unlocked = true;
  }

  function speak(text, btn) {
    if (!synth) return;
    synth.cancel();
    document.querySelectorAll(".replay.playing").forEach((b) => b.classList.remove("playing"));
    const yue = /[\u3400-\u9fff]/.test(text);
    const voice = pickVoice(yue);
    const clean = text
      .replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, "")
      .replace(/[~～]/g, " ");
    // Speak sentence by sentence (Chrome cuts off long utterances).
    const parts = (clean.match(/[^。！？!?\n]+[。！？!?]*/g) || []).map((p) => p.trim()).filter(Boolean);
    parts.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.lang = voice ? voice.lang : yue ? "zh-HK" : "en-US";
      if (voice) u.voice = voice;
      u.rate = 1;
      u.pitch = 1.15; // a bit higher – it's a little cabbage
      if (btn && i === 0) u.onstart = () => btn.classList.add("playing");
      if (btn && i === parts.length - 1) u.onend = () => btn.classList.remove("playing");
      synth.speak(u);
    });
  }

  const spkBtn = $("#speak");
  function showSpeak() {
    spkBtn.textContent = speakOn ? "🔊" : "🔇";
    spkBtn.setAttribute("aria-pressed", speakOn);
  }
  if (synth) {
    spkBtn.hidden = false;
    showSpeak();
    spkBtn.addEventListener("click", () => {
      unlock();
      speakOn = !speakOn;
      try { localStorage.setItem("cc-speak", speakOn ? "1" : "0"); } catch {}
      if (!speakOn) synth.cancel();
      showSpeak();
    });
  }

  function applyLang() {
    const t = T[lang];
    document.documentElement.lang = lang === "yue" ? "zh-HK" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n]));
    document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    input.placeholder = t.placeholder;
    quick.innerHTML = "";
    t.quick.forEach((q) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = q;
      b.onclick = () => ask(q);
      quick.appendChild(b);
    });
    if (recog) recog.lang = t.mic;
  }

  function mini() {
    const img = document.createElement("img");
    img.src = "/assets/choichoi-256.webp";
    img.alt = "";
    img.className = "mini";
    return img;
  }

  function addMsg(role, text, cls) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "me" : "bot");
    if (role !== "user") row.appendChild(mini());
    const b = document.createElement("div");
    b.className = "bubble" + (cls ? " " + cls : "");
    if (cls === "typing") b.innerHTML = "<span></span><span></span><span></span>";
    else b.textContent = text;
    row.appendChild(b);
    if (role !== "user" && !cls && synth) {
      const r = document.createElement("button");
      r.type = "button";
      r.className = "replay";
      r.textContent = "🔊";
      r.setAttribute("aria-label", "Read aloud");
      r.onclick = () => { unlock(); speak(text, r); };
      row.appendChild(r);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function showHello() {
    chat.innerHTML = '<div class="hero"><img class="big" src="/assets/choichoi.webp" alt="Choi Choi" width="476" height="600"></div>';
    addMsg("assistant", T[lang].hello);
  }

  async function ask(text, viaVoice = false) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    addMsg("user", text);
    history.push({ role: "user", content: text });
    const typing = addMsg("assistant", "", "typing");

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-12) }),
      });
      const data = await r.json().catch(() => ({}));
      typing.remove();
      if (!r.ok || !data.reply) throw new Error(data.error || r.status);
      history.push({ role: "assistant", content: data.reply });
      const row = addMsg("assistant", data.reply);
      if (speakOn || viaVoice) speak(data.reply, row.querySelector(".replay"));
    } catch (e) {
      typing.remove();
      history.pop(); // let the user retry the same question
      addMsg("assistant", T[lang].error, "error");
    } finally {
      busy = false;
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); unlock(); ask(input.value); });
  quick.addEventListener("click", unlock);

  document.querySelectorAll(".lang button").forEach((b) =>
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("cc-lang", lang); } catch {}
      const fresh = history.length === 0;
      applyLang();
      if (fresh) showHello();
    })
  );

  // Voice input (Web Speech API), hold-to-talk: press and hold 🎤, let go to send.
  // Works in Chrome, Edge and iOS/macOS Safari.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, listening = false, holding = false, committed = "", current = "", pressedAt = 0;
  if (SR) {
    recog = new SR();
    recog.interimResults = true;
    recog.continuous = true; // keep listening for as long as the button is held
    recog.maxAlternatives = 1;
    micBtn.hidden = false;

    const startRec = () => {
      recog.lang = T[lang].mic;
      try { recog.start(); listening = true; } catch {}
    };

    recog.onresult = (e) => {
      current = "";
      for (const r of e.results) current += r[0].transcript;
      input.value = (committed + " " + current).trim();
    };
    recog.onend = () => {
      listening = false;
      if (holding) { // browser stopped by itself (e.g. silence) while still held → keep going
        committed = (committed + " " + current).trim();
        current = "";
        startRec();
        return;
      }
      micBtn.classList.remove("listening");
      input.placeholder = T[lang].placeholder;
      const text = (committed + " " + current).trim();
      committed = current = "";
      if (text) ask(text, true); // asked by voice → answer by voice
      else if (Date.now() - pressedAt < 400) { // just a tap → show how it works
        input.placeholder = T[lang].holdHint;
        setTimeout(() => (input.placeholder = T[lang].placeholder), 2500);
      }
    };
    recog.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        holding = false;
        addMsg("assistant", T[lang].noMic, "error");
      }
    };

    const press = (e) => {
      e.preventDefault();
      unlock();
      if (synth) synth.cancel(); // stop talking so Choi Choi doesn't hear itself
      if (holding || busy) return;
      holding = true;
      pressedAt = Date.now();
      committed = current = "";
      input.value = "";
      input.placeholder = T[lang].listening;
      micBtn.classList.add("listening");
      if (e.pointerId !== undefined) { try { micBtn.setPointerCapture(e.pointerId); } catch {} }
      if (!listening) startRec();
    };
    const release = () => {
      if (!holding) return;
      holding = false;
      try { recog.stop(); } catch {}
    };

    micBtn.addEventListener("pointerdown", press);
    micBtn.addEventListener("pointerup", release);
    micBtn.addEventListener("pointercancel", release);
    micBtn.addEventListener("contextmenu", (e) => e.preventDefault()); // no long-press menu on phones
    micBtn.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) press(e); });
    micBtn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); });
  }


  applyLang();
  showHello();
})();
</script>
</body>
</html>
